<header class="header">
  <div class="logo">
    <img src="https://i.postimg.cc/76ZBGkYC/Logo-Games-List.jpg" width="30px"/>
    Gamodan
  </div>
  <nav class="menu">
    <a routerLink="/" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">Início</a>
    @if (authService.autenticado()) {
      <a routerLink="/lista" routerLinkActive="ativo">Lista</a>
      <a routerLink="/perfil" routerLinkActive="ativo">Perfil</a>
    }
    <a routerLink="/contato" routerLinkActive="ativo">Contato</a>
    @if (authService.autenticado()) {
      <button type="button" class="menu-acao" (click)="sair()">Sair</button>
    }
  </nav>
</header>
